# release-please opens and maintains the Release PR against the integration staging branch,
# then tags and creates the GitHub Release when it is merged.
#
# This workflow authenticates as a GitHub App (secrets APP_ID + APP_PRIVATE_KEY) because a PR
# opened with the built-in GITHUB_TOKEN does not trigger other workflows, so the required CI
# check would never run on the Release PR and the merge would sit blocked. A static token will
# not work either: App installation tokens expire in an hour, so a step mints a fresh one.
name: release-please

on:
  push:
    branches: [integration]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: integration
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
